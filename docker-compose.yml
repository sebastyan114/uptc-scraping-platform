services:
  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "${BACKEND_PORT:-8000}:${8000}"
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      APP_ENV: ${APP_ENV}
      APP_PORT: ${8000}

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QRANT_URL: ${QRANT_URL}
      QRANT_COLLECTION: ${QRANT_COLLECTION}

      SCANNER_ENGINE_BIN: ${SCANNER_ENGINE_BIN}
      SCANNER_MAX_SCAN_SECONDS: ${SCANNER_MAX_SCAN_SECONDS}
      SCANNER_REQUEST_TIMEOUT_SECONDS: ${SCANNER_REQUEST_TIMEOUT_SECONDS}
      SCANNER_MAX_TARGETS: ${SCANNER_MAX_TARGETS}
      SCANNER_MAX_EVIDENCE_CHARS: ${SCANNER_MAX_EVIDENCE_CHARS}
      SCANNER_ALLOW_PRIVATE_TARGETS: ${SCANNER_ALLOW_PRIVATE_TARGETS}
    volumes:
      - ./backend:/app
      - nuclei_templates:/home/app/nuclei-templates
      - ./nuclei/config/config.yaml:/home/app/.config/nuclei/nuclei.config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - app_network

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_METRICS_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app_network

volumes:
  nuclei_templates:
  postgres_data:
  qdrant_data:

networks:
  app_network:
    driver: bridge