services:
  backend:
    build:
      context: ./backend
    container_name: uptc-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - uptc-network

  postgres:
    image: postgres:16
    container_name: uptc-postgres
    environment:
      POSTGRES_DB: websec
      POSTGRES_USER: websec_user
      POSTGRES_PASSWORD: websec_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U websec_user -d websec"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - uptc-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: uptc-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - uptc-network

volumes:
  postgres_data:
  qdrant_data:

networks:
  uptc-network:
    driver: bridge