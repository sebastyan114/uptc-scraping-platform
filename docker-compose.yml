services:
  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      APP_ENV: ${APP_ENV}
      APP_PORT: 8000

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}

      ZAP_URL: http://zap:8080
      ZAP_API_KEY: ${ZAP_API_KEY}

      SCANNER_DISCOVERY_MAX_DEPTH: ${SCANNER_DISCOVERY_MAX_DEPTH:-3}
      SCANNER_MAX_DURATION_SECONDS: ${SCANNER_MAX_DURATION_SECONDS:-120}
      SCANNER_DISCOVERY_SHARE: ${SCANNER_DISCOVERY_SHARE:-0.2}
      SCANNER_ACTIVE_SCAN_ENABLED: ${SCANNER_ACTIVE_SCAN_ENABLED:-false}
      SCANNER_REQUEST_TIMEOUT_SECONDS: ${SCANNER_REQUEST_TIMEOUT_SECONDS}
      SCANNER_ALLOW_PRIVATE_TARGETS: ${SCANNER_ALLOW_PRIVATE_TARGETS:-false}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      zap:
        condition: service_started
    networks:
      - app_network

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  zap:
    image: zaproxy/zap-stable:2.17.0
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.key=${ZAP_API_KEY}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/JSON/core/view/version/?apikey=${ZAP_API_KEY}"]
      interval: 10s
      retries: 12
    networks:
      - app_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    healthcheck:
       test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
       interval: 5s
       timeout: 5s
       retries: 10
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app_network

volumes:
  postgres_data:
  qdrant_data:

networks:
  app_network:
    driver: bridge